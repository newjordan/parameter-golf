name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the hub, data helpers, and test runner
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Python tests
        run: python -m pytest -q

      - name: Hub index matches records/
        run: python -m parameter_golf.build_index --check

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript tests
        run: node --test tests/hub_view.test.js
