[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "parameter-golf"
version = "0.2.0"
description = "Parameter Golf starter scripts and the checked-in research hub."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "OpenAI" }]
dependencies = [
  "numpy>=2.1",
]

[project.optional-dependencies]
data = [
  "huggingface-hub>=0.26",
  "datasets>=3.1",
  "sentencepiece>=0.2",
  "tiktoken>=0.8",
  "tqdm>=4.67",
]
train = [
  "torch>=2.5",
  "sentencepiece>=0.2",
  "huggingface-hub>=0.26",
  "datasets>=3.1",
  "tiktoken>=0.8",
  "tqdm>=4.67",
  "typing-extensions>=4.12",
]
mlx = [
  "mlx>=0.22",
  "sentencepiece>=0.2",
]
dev = [
  "pytest>=8.3",
  "huggingface-hub>=0.26",
]

[project.scripts]
parameter-golf-index = "parameter_golf.build_index:main"

[tool.setuptools.packages.find]
include = ["parameter_golf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
